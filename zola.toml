# The URL the site will be built for
base_url = "https://ayles.github.io"
title = "ayles"
description = "Notes on eBPF, systems programming, and other low-level things"
default_language = "en"

generate_feeds = true
feed_filenames = ["atom.xml"]

compile_sass = false
build_search_index = false
minify_html = true

[translations]
feed = "feed"
minutes = "min read"

[languages.ru]
title = "ayles"
description = "Заметки про eBPF, системное программирование и прочие низкоуровневые вещи"
generate_feeds = true
feed_filenames = ["atom.xml"]
build_search_index = false

[languages.ru.translations]
feed = "лента"
minutes = "мин чтения"

[markdown.highlighting]
# Class-based highlighting: Zola emits giallo-light.css / giallo-dark.css
# and code blocks follow the visitor's light/dark preference.
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"
