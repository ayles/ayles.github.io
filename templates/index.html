{% extends "base.html" %}

{% block head %}
  <link rel="canonical" href="{{ section.permalink }}">
{% endblock head %}

{% block content %}
{{ section.content | safe }}
<ul class="post-list">
  {% for page in section.pages %}
  <li>
    <time datetime="{{ page.date }}">{{ page.date | date(format="%Y-%m-%d") }}</time>
    <a href="{{ page.permalink }}">{{ page.title }}</a>
  </li>
  {% endfor %}
</ul>
{% endblock content %}
